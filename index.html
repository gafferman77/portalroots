<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Roots</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#3ecf3e;
  --yellow:#f5c200;
  --red:#e03030;
  --white:#f0f0e8;
  --text-dim:#8a9a8a;
  --muted:#3a4a3a;
  --surface:rgba(9,14,9,0.82);
  --border-y:rgba(245,194,0,0.22);
}
html,body{width:100%;min-height:100vh;color:var(--white);font-family:'EB Garamond',Georgia,serif;overflow-x:hidden;background:#050805;}

.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 50%, rgba(15,40,15,0.9) 0%, transparent 70%),
    radial-gradient(ellipse 60% 80% at 80% 30%, rgba(60,10,10,0.7) 0%, transparent 70%),
    url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="400" height="400" filter="url(%23n)" opacity="0.06"/></svg>') repeat,
    #080d08;
}

nav{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 40px;
  border-bottom:1px solid rgba(62,207,62,0.12);
}
.nav-logo{display:flex;align-items:center;gap:14px;}
.nav-logo img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid rgba(62,207,62,0.3);}
.nav-brand{display:flex;flex-direction:column;}
.nav-brand span:first-child{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;color:var(--green);}
.nav-brand span:last-child{font-size:10px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}

main{position:relative;z-index:5;padding:0 40px;}

/* ─── HERO ─── */
.hero{
  text-align:center;
  padding:64px 20px 48px;
}
.hero-logo{width:120px;height:120px;border-radius:50%;border:2px solid rgba(62,207,62,0.25);margin:0 auto 28px;}
.hero-eyebrow{font-size:11px;letter-spacing:4px;color:var(--text-dim);text-transform:uppercase;margin-bottom:12px;}
.hero-title{font-family:'Oswald',sans-serif;font-size:clamp(42px,7vw,72px);font-weight:700;letter-spacing:2px;line-height:1;}
.hero-title .p{color:var(--green);}
.hero-title .r{color:var(--yellow);}
.hero-title .c{color:var(--red);}
.hero-sub{font-family:'EB Garamond',serif;font-style:italic;font-size:18px;color:var(--text-dim);margin-top:16px;}
.hero-divider{display:flex;align-items:center;justify-content:center;gap:6px;margin:28px auto 0;width:80px;}
.hero-divider span{height:2px;flex:1;border-radius:2px;}
.hero-divider .d1{background:var(--green);}
.hero-divider .d2{background:var(--yellow);}
.hero-divider .d3{background:var(--red);}

/* ─── BANNER EN REFORMA ─── */
.reform-banner{
  position:relative;
  max-width:640px;margin:40px auto 0;
  display:flex;align-items:center;gap:20px;
  background:rgba(245,194,0,0.05);
  border:1px solid rgba(245,194,0,0.26);
  border-radius:16px;
  padding:24px 28px 24px 30px;
  text-align:left;
  overflow:hidden;
}
/* Lomo tricolor a la izquierda */
.reform-banner::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--green) 0 33%,var(--yellow) 33% 66%,var(--red) 66% 100%);
}
.reform-icon{font-size:30px;line-height:1;flex-shrink:0;}
.reform-body{flex:1;}
.reform-title{
  font-family:'Oswald',sans-serif;
  font-size:14px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--yellow);margin-bottom:7px;
}
.reform-desc{
  font-family:'EB Garamond',serif;
  font-size:16px;color:var(--white);line-height:1.55;
}
@media(max-width:600px){
  .reform-banner{flex-direction:column;text-align:center;gap:12px;padding:22px 20px;}
  .reform-banner::before{width:100%;height:5px;bottom:auto;}
}

/* ─── SECTION LABELS ─── */
.section-header{
  display:flex;align-items:center;gap:16px;
  margin:48px 0 24px;
}
.section-badge{
  font-family:'Oswald',sans-serif;
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  padding:5px 14px;border-radius:20px;
  border:1px solid;
  white-space:nowrap;
}
.section-badge.private{color:var(--yellow);border-color:rgba(245,194,0,0.3);background:rgba(245,194,0,0.07);}
.section-badge.public{color:var(--green);border-color:rgba(62,207,62,0.3);background:rgba(62,207,62,0.07);}
.section-line{flex:1;height:1px;background:rgba(255,255,255,0.07);}
.section-desc{font-size:13px;color:var(--text-dim);margin-bottom:20px;padding-left:2px;}

/* ─── GRIDS ─── */
.grid{
  display:grid;
  gap:16px;
  margin-bottom:16px;
}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}

/* ─── CARDS ─── */
.card{
  background:rgba(9,14,9,0.75);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:22px 20px;
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  text-decoration:none;
  cursor:pointer;
  transition:border-color 0.2s,background 0.2s,transform 0.15s;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  opacity:0;transition:opacity 0.2s;
}
.card:hover{transform:translateY(-2px);}

/* Private cards — yellow accent */
.card.private{border-top-color:rgba(245,194,0,0.2);}
.card.private::before{background:linear-gradient(90deg,transparent,var(--yellow),transparent);}
.card.private:hover{border-color:rgba(245,194,0,0.4);background:rgba(15,20,10,0.85);}
.card.private:hover::before{opacity:1;}

/* Public cards — green accent */
.card.public{border-top-color:rgba(62,207,62,0.2);}
.card.public::before{background:linear-gradient(90deg,transparent,var(--green),transparent);}
.card.public:hover{border-color:rgba(62,207,62,0.35);background:rgba(10,18,10,0.88);}
.card.public:hover::before{opacity:1;}

/* Cine card spans 2 cols */
.card-wide{grid-column:span 2;}

.card-icon{
  font-size:22px;line-height:1;
  margin-bottom:2px;
}
.card-name{
  font-family:'Oswald',sans-serif;
  font-size:14px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--white);
}
.card.private .card-name{color:var(--yellow);}
.card.public .card-name{color:var(--green);}
.card-desc{font-size:13px;color:var(--text-dim);line-height:1.5;}
.card-arrow{
  margin-top:auto;font-size:12px;letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
  opacity:0.5;transition:opacity 0.2s;
}
.card:hover .card-arrow{opacity:1;}

/* Cine sub-items */
.cine-subs{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-top:4px;
}
.cine-tag{
  font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:1px;
  padding:3px 10px;border-radius:12px;
  background:rgba(62,207,62,0.08);
  border:1px solid rgba(62,207,62,0.2);
  color:rgba(62,207,62,0.7);
}
.cine-tag.wip{
  background:rgba(245,194,0,0.08);
  border-color:rgba(245,194,0,0.2);
  color:rgba(245,194,0,0.6);
}

/* ─── VIP MODAL ─── */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,0.75);
  align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.modal-box{
  background:rgba(10,16,10,0.97);
  border:1px solid rgba(245,194,0,0.25);
  border-radius:16px;
  padding:40px;
  width:90%;max-width:380px;
  text-align:center;
}
.m-icon{font-size:32px;margin-bottom:16px;}
.m-eye{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--yellow);margin-bottom:8px;}
.m-title{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;color:var(--white);margin-bottom:24px;}
.m-input{
  width:100%;background:rgba(255,255,255,0.05);
  border:1px solid rgba(245,194,0,0.2);border-radius:8px;
  color:var(--white);font-family:'EB Garamond',serif;font-size:16px;
  padding:12px 16px;text-align:center;outline:none;
  transition:border-color 0.2s;
}
.m-input:focus{border-color:rgba(245,194,0,0.5);}
.m-btn{
  width:100%;margin-top:12px;
  background:rgba(245,194,0,0.12);
  border:1px solid rgba(245,194,0,0.35);
  border-radius:8px;color:var(--yellow);
  font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:2px;
  padding:12px;cursor:pointer;transition:background 0.2s;
}
.m-btn:hover{background:rgba(245,194,0,0.2);}
.m-err{color:var(--red);font-size:13px;margin-top:10px;display:none;}
.m-cancel{font-size:12px;color:var(--text-dim);margin-top:14px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;}
.m-cancel:hover{color:var(--white);}

/* ─── FOOTER ─── */
footer{
  position:relative;z-index:5;
  text-align:center;padding:32px 40px;
  border-top:1px solid rgba(255,255,255,0.05);
  margin-top:48px;
}
footer p{font-size:11px;color:var(--text-dim);letter-spacing:1px;}

/* ─── RESPONSIVE ─── */
@media(max-width:900px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  nav{padding:14px 20px;}
  main{padding:0 16px;}
  .grid-4,.grid-2{grid-template-columns:1fr;}
  .card-wide{grid-column:span 1;}
  .hero{padding:40px 10px 32px;}
}
</style>
</head>
<body>

<div class="bg"></div>


<main>

  <!-- HERO -->
  <section class="hero">
    <p class="hero-eyebrow">Bienvenido a</p>
    <h1 class="hero-title">
      <span class="p">PORTAL</span><span class="r">ROOTS</span><span class="c">.COM</span>
    </h1>
    <p class="hero-sub">Un ecosistema impulsado por ideas.</p>
    <div class="hero-divider">
      <span class="d1"></span>
      <span class="d2"></span>
      <span class="d3"></span>
    </div>

    <!-- BANNER: sitio en reforma -->
    <div class="reform-banner">
      <span class="reform-icon">🚧</span>
      <div class="reform-body">
        <p class="reform-title">Sitio en reforma</p>
        <p class="reform-desc">Estamos reestructurando todo el Portal. Muy pronto vas a disfrutar de las nuevas herramientas del Portal Roots. Gracias por la paciencia. 🌱</p>
      </div>
    </div>
  </section>

</main>

<footer>
  <p>© 2025 Roots Studio · Buenos Aires · <a href="mailto:sr.eme.roots@gmail.com" style="color:var(--green);text-decoration:none;">sr.eme.roots@gmail.com</a></p>
</footer>

</body>
</html>
