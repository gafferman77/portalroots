<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V4 Admin — Roots Studio</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,600;1,400&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0e; --surface: #141414; --surface2: #181818; --surface3: #1e1e1e;
  --border: #222; --border2: #2a2a2a;
  --text: #d4d4d4; --text-dim: #666; --text-muted: #333;
  --green: #3ecf3e; --yellow: #f5c200; --red: #e03030;
  --copper: #c4894f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'EB Garamond', serif; min-height: 100vh; }

/* HEADER */
.header { background: #0a0a0a; border-bottom: 1px solid var(--border); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; }
.header-title { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 0.1em; color: #888; }
.header-title span { color: var(--green); }
.header-right { display: flex; align-items: center; gap: 12px; }
.key-input { background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); padding: 8px 14px; border-radius: 6px; font-size: 14px; font-family: monospace; width: 180px; outline: none; }
.btn { background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: 'EB Garamond', serif; }
.btn:hover { border-color: #444; color: #aaa; }
.btn.primary { border-color: var(--green); color: var(--green); }
.btn.danger { border-color: var(--red); color: var(--red); }

/* LAYOUT */
.container { max-width: 1200px; margin: 0 auto; padding: 28px; }

/* CLIENTS GRID */
.clients-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
.client-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; cursor: pointer; transition: all 0.2s; position: relative; }
.client-card:hover { border-color: var(--border2); background: var(--surface2); }
.client-card.active { border-color: var(--copper); }
.client-badge { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px; }
.client-name { font-size: 22px; font-style: italic; color: var(--text); margin-bottom: 4px; }
.client-ia { font-size: 14px; color: var(--copper); margin-bottom: 12px; }
.client-stats { display: flex; gap: 16px; }
.stat { text-align: center; }
.stat-num { font-family: 'Oswald', sans-serif; font-size: 20px; color: var(--text); }
.stat-label { font-size: 11px; color: var(--text-muted); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; position: absolute; top: 16px; right: 16px; }
.status-dot.ok { background: var(--green); }
.status-dot.empty { background: var(--text-muted); }
.loading-card { display: flex; align-items: center; justify-content: center; height: 120px; color: var(--text-muted); font-style: italic; }

/* DETAIL PANEL */
.detail-panel { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.detail-panel.visible { display: block; }
.detail-tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab { padding: 12px 20px; font-size: 15px; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab.active { color: var(--text); border-bottom-color: var(--copper); }
.tab-content { display: none; padding: 24px; }
.tab-content.active { display: block; }

/* TEMAS */
.temas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
.tema-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.tema-label { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
.tema-bar { height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.tema-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.tema-fill.casual { background: var(--green); }
.tema-fill.intimo { background: var(--copper); }
.tema-fill.fotos { background: var(--yellow); }
.tema-fill.emocional { background: #7b9fff; }
.tema-fill.otro { background: var(--text-muted); }
.tema-pct { font-family: 'Oswald', sans-serif; font-size: 18px; color: var(--text); }

/* CONVERSACIÓN */
.chat-log { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
.msg-log { display: flex; flex-direction: column; max-width: 75%; }
.msg-log.user { align-self: flex-end; }
.msg-log.assistant { align-self: flex-start; }
.msg-log-name { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.msg-log.user .msg-log-name { text-align: right; }
.msg-log-bubble { padding: 10px 14px; border-radius: 10px; font-size: 16px; line-height: 1.55; }
.msg-log.user .msg-log-bubble { background: var(--surface3); color: #777; border-top-right-radius: 3px; }
.msg-log.assistant .msg-log-bubble { background: #1c1c1c; border: 1px solid var(--border2); color: var(--text); border-top-left-radius: 3px; }
.msg-log-img { max-width: 200px; border-radius: 8px; margin-top: 6px; border: 1px solid var(--border2); }

/* FOTOS */
.fotos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.foto-item { border-radius: 8px; overflow: hidden; border: 1px solid var(--border2); background: var(--surface2); }
.foto-item img { width: 100%; height: 160px; object-fit: cover; display: block; cursor: pointer; }
.foto-caption { padding: 8px 10px; font-size: 12px; color: var(--text-muted); font-style: italic; }
.empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; font-size: 18px; }

/* MEMORIA */
.memoria-list { display: flex; flex-direction: column; gap: 8px; }
.memoria-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; display: flex; gap: 12px; }
.memoria-key { font-family: monospace; font-size: 13px; color: var(--copper); min-width: 120px; }
.memoria-val { font-size: 15px; color: var(--text); }

/* RESET */
.reset-section { padding: 20px 0; border-top: 1px solid var(--border); margin-top: 20px; }
.reset-section p { color: var(--text-dim); font-size: 15px; margin-bottom: 12px; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
.lightbox.visible { display: flex; }
.lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; object-fit: contain; }
.lightbox-close { position: absolute; top: 20px; right: 24px; color: #555; font-size: 28px; cursor: pointer; background: none; border: none; }

/* TOAST */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); padding: 12px 20px; border-radius: 8px; font-size: 15px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
.toast.visible { opacity: 1; }

@media (max-width: 768px) {
  .clients-grid { grid-template-columns: 1fr; }
  .temas-grid { grid-template-columns: 1fr; }
  .container { padding: 16px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">V4 <span>ADMIN</span> — Roots Studio</div>
  <div class="header-right">
    <input type="password" class="key-input" id="adminKey" placeholder="admin key" value="">
    <button class="btn primary" onclick="cargarTodo()">Cargar</button>
  </div>
</div>

<div class="container">

  <!-- CLIENTES -->
  <div class="clients-grid" id="clientsGrid">
    <div class="loading-card">ingresá la clave y cargá</div>
    <div class="loading-card"></div>
    <div class="loading-card"></div>
  </div>

  <!-- DETALLE -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-tabs">
      <div class="tab active" onclick="switchTab('temas')">Temas</div>
      <div class="tab" onclick="switchTab('chat')">Conversación</div>
      <div class="tab" onclick="switchTab('fotos')">Fotos</div>
      <div class="tab" onclick="switchTab('memoria')">Memoria</div>
      <div class="tab" onclick="switchTab('config')">Config</div>
    </div>

    <!-- TEMAS -->
    <div class="tab-content active" id="tab-temas">
      <div class="temas-grid" id="temasGrid"></div>
    </div>

    <!-- CHAT -->
    <div class="tab-content" id="tab-chat">
      <div class="chat-log" id="chatLog"></div>
    </div>

    <!-- FOTOS -->
    <div class="tab-content" id="tab-fotos">
      <div class="fotos-grid" id="fotosGrid"></div>
    </div>

    <!-- MEMORIA -->
    <div class="tab-content" id="tab-memoria">
      <div class="memoria-list" id="memoriaList"></div>
    </div>

    <!-- CONFIG -->
    <div class="tab-content" id="tab-config">
      <div id="configContent"></div>
      <div class="reset-section">
        <p>Resetear borra toda la conversación y memoria del cliente. No se puede deshacer.</p>
        <button class="btn danger" onclick="resetearCliente()">Resetear cliente</button>
      </div>
    </div>

  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="cerrarLightbox()">
  <button class="lightbox-close" onclick="cerrarLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const CLIENTES = [
  { id: 'c01', url: 'https://v4-c01.rootsstudioar.workers.dev' },
  { id: 'c02', url: 'https://v4-c02.rootsstudioar.workers.dev' },
  { id: 'c03', url: 'https://v4-c03.rootsstudioar.workers.dev' },
  { id: 'c04', url: 'https://v4-c04.rootsstudioar.workers.dev' },
  { id: 'c05', url: 'https://v4-c05.rootsstudioar.workers.dev' },
  { id: 'c06', url: 'https://v4-c06.rootsstudioar.workers.dev' },
];
let datosClientes = {};
let clienteActivo = null;

function toast(msg, dur) {
  dur = dur || 2500;
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), dur);
}

async function cargarTodo() {
  const key = document.getElementById('adminKey').value.trim();
  if (!key) { toast('Ingresá la clave admin'); return; }

  const grid = document.getElementById('clientsGrid');
  grid.innerHTML = CLIENTES.map(c => `<div class="loading-card" id="card-${c.id}">cargando ${c.id}...</div>`).join('');

  await Promise.all(CLIENTES.map(c => cargarCliente(c, key)));
}

async function cargarCliente(cliente, key) {
  try {
    const res = await fetch(cliente.url + '/admin', {
      headers: { 'X-Admin-Key': key }
    });
    if (!res.ok) throw new Error('No autorizado');
    const data = await res.json();
    datosClientes[cliente.id] = { ...data, url: cliente.url, key };
    renderCard(cliente.id);
  } catch(e) {
    const card = document.getElementById('card-' + cliente.id);
    if (card) card.innerHTML = `<div style="padding:20px"><div class="client-badge">${cliente.id}</div><div style="color:var(--red);font-size:14px;margin-top:8px">${e.message}</div></div>`;
  }
}

function renderCard(id) {
  const d = datosClientes[id];
  if (!d) return;

  const config = d.config || [];
  const nombre = (config.find(c => c.clave === 'nombre') || {}).valor || '—';
  const nombreIa = (config.find(c => c.clave === 'nombre_ia') || {}).valor || 'V';
  const msgs = d.mensajes || [];
  const fotos = msgs.filter(m => m.imagen_url);
  const mem = d.memoria || [];
  const configurado = config.length > 0;

  const card = document.getElementById('card-' + id);
  if (!card) return;

  card.className = 'client-card' + (clienteActivo === id ? ' active' : '');
  card.onclick = () => seleccionarCliente(id);
  card.innerHTML = `
    <div class="status-dot ${configurado ? 'ok' : 'empty'}"></div>
    <div class="client-badge">${id.toUpperCase()}</div>
    <div class="client-name">${nombre}</div>
    <div class="client-ia">IA: ${nombreIa}</div>
    <div class="client-stats">
      <div class="stat"><div class="stat-num">${msgs.length}</div><div class="stat-label">mensajes</div></div>
      <div class="stat"><div class="stat-num">${fotos.length}</div><div class="stat-label">fotos</div></div>
      <div class="stat"><div class="stat-num">${mem.length}</div><div class="stat-label">recuerdos</div></div>
    </div>
  `;
}

function seleccionarCliente(id) {
  clienteActivo = id;
  CLIENTES.forEach(c => {
    const card = document.getElementById('card-' + c.id);
    if (card) card.classList.toggle('active', c.id === id);
  });

  const d = datosClientes[id];
  if (!d) return;

  document.getElementById('detailPanel').classList.add('visible');
  switchTab('temas');
  renderTemas(d);
  renderChat(d);
  renderFotos(d);
  renderMemoria(d);
  renderConfig(d, id);
}

// ── ANÁLISIS DE TEMAS ──
function analizarTemas(mensajes) {
  const userMsgs = mensajes.filter(m => m.role === 'user').map(m => (m.content || '').toLowerCase());
  const total = userMsgs.length || 1;

  const patrones = {
    'Charla casual': /hola|qué tal|cómo estás|buenas|chau|dale|che|jaja|lol|bien|mal|día|noche|tarde/,
    'Íntimo / romántico': /te quiero|te extraño|pienso en vos|me gustás|beso|abrazo|cuerpo|sensual|coquete|linda|hermosa|rico|calor|piel|cerca/,
    'Fotos': /foto|imagen|mostrá|mandale|quiero verte|cómo sos|cómo te ves/,
    'Emocional / personal': /triste|solo|sola|angustia|miedo|problema|ayuda|necesito|mal|llorar|cansado|preocupa|ansiedad/,
    'Sexualidad': /sexo|cama|desnud|íntim|excit|horni|caliente|ganas|deseo/,
    'Consultas / info': /qué es|cómo|por qué|cuándo|dónde|busca|precio|temperatura|clima|resultado/,
  };

  const conteos = {};
  for (const [tema, pat] of Object.entries(patrones)) {
    conteos[tema] = userMsgs.filter(m => pat.test(m)).length;
  }

  // Normalizar
  const totalContado = Object.values(conteos).reduce((a, b) => a + b, 0) || 1;
  const result = {};
  for (const [tema, cnt] of Object.entries(conteos)) {
    result[tema] = Math.round((cnt / totalContado) * 100);
  }

  // Ajustar para que sumen 100
  const suma = Object.values(result).reduce((a, b) => a + b, 0);
  if (suma < 100) {
    const diff = 100 - suma;
    const primerTema = Object.keys(result)[0];
    result[primerTema] = (result[primerTema] || 0) + diff;
  }

  return result;
}

const TEMA_COLORES = {
  'Charla casual': 'casual',
  'Íntimo / romántico': 'intimo',
  'Fotos': 'fotos',
  'Emocional / personal': 'emocional',
  'Sexualidad': 'intimo',
  'Consultas / info': 'otro',
};

function renderTemas(d) {
  const msgs = d.mensajes || [];
  if (msgs.length === 0) {
    document.getElementById('temasGrid').innerHTML = '<div class="empty-state" style="grid-column:span 2">Sin conversaciones aún</div>';
    return;
  }

  const temas = analizarTemas(msgs);
  const sorted = Object.entries(temas).sort((a, b) => b[1] - a[1]);

  document.getElementById('temasGrid').innerHTML = sorted.map(([tema, pct]) => `
    <div class="tema-item">
      <div class="tema-label">${tema}</div>
      <div class="tema-bar"><div class="tema-fill ${TEMA_COLORES[tema] || 'otro'}" style="width:${pct}%"></div></div>
      <div class="tema-pct">${pct}%</div>
    </div>
  `).join('');
}

function renderChat(d) {
  const msgs = d.mensajes || [];
  const config = d.config || [];
  const nombre = (config.find(c => c.clave === 'nombre') || {}).valor || 'Cliente';
  const nombreIa = (config.find(c => c.clave === 'nombre_ia') || {}).valor || 'V';

  if (msgs.length === 0) {
    document.getElementById('chatLog').innerHTML = '<div class="empty-state">Sin mensajes aún</div>';
    return;
  }

  document.getElementById('chatLog').innerHTML = [...msgs].reverse().map(m => `
    <div class="msg-log ${m.role}">
      <div class="msg-log-name">${m.role === 'user' ? nombre : nombreIa}</div>
      <div class="msg-log-bubble">${(m.content || '').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>
      ${m.imagen_url ? `<img class="msg-log-img" src="${m.imagen_url}" onclick="abrirLightbox('${m.imagen_url}')" alt="foto">` : ''}
    </div>
  `).join('');
}

function renderFotos(d) {
  const msgs = d.mensajes || [];
  const fotos = msgs.filter(m => m.imagen_url);

  if (fotos.length === 0) {
    document.getElementById('fotosGrid').innerHTML = '<div class="empty-state" style="grid-column:1/-1">No hay fotos generadas aún</div>';
    return;
  }

  document.getElementById('fotosGrid').innerHTML = fotos.map(m => `
    <div class="foto-item">
      <img src="${m.imagen_url}" alt="foto" onclick="abrirLightbox('${m.imagen_url}')">
      <div class="foto-caption">${m.fecha ? new Date(m.fecha).toLocaleDateString('es-AR') : ''}</div>
    </div>
  `).join('');
}

function renderMemoria(d) {
  const mem = d.memoria || [];
  if (mem.length === 0) {
    document.getElementById('memoriaList').innerHTML = '<div class="empty-state">Sin recuerdos guardados aún</div>';
    return;
  }
  document.getElementById('memoriaList').innerHTML = mem.map(m => `
    <div class="memoria-item">
      <div class="memoria-key">${m.clave}</div>
      <div class="memoria-val">${m.valor}</div>
    </div>
  `).join('');
}

function renderConfig(d, id) {
  const config = d.config || [];
  const nombre = (config.find(c => c.clave === 'nombre') || {}).valor || '—';
  const nombreIa = (config.find(c => c.clave === 'nombre_ia') || {}).valor || '—';
  const url = CLIENTES.find(c => c.id === id)?.url || '';

  document.getElementById('configContent').innerHTML = `
    <div class="memoria-list">
      <div class="memoria-item"><div class="memoria-key">Cliente</div><div class="memoria-val">${id.toUpperCase()}</div></div>
      <div class="memoria-item"><div class="memoria-key">Nombre usuario</div><div class="memoria-val">${nombre}</div></div>
      <div class="memoria-item"><div class="memoria-key">Nombre IA</div><div class="memoria-val">${nombreIa}</div></div>
      <div class="memoria-item"><div class="memoria-key">URL</div><div class="memoria-val" style="font-family:monospace;font-size:13px">${url}</div></div>
      <div class="memoria-item"><div class="memoria-key">Mensajes</div><div class="memoria-val">${(d.mensajes || []).length}</div></div>
    </div>
  `;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const tabs = ['temas','chat','fotos','memoria','config'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

async function resetearCliente() {
  if (!clienteActivo) return;
  const d = datosClientes[clienteActivo];
  if (!d) return;
  if (!confirm('¿Seguro? Esto borra toda la conversación y memoria de ' + clienteActivo.toUpperCase())) return;

  try {
    const res = await fetch(d.url + '/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-V4-Token': d.key },
      body: JSON.stringify({ confirmar: 'borrar todo' })
    });
    if (res.ok) {
      toast('Cliente reseteado ✓');
      await cargarCliente(CLIENTES.find(c => c.id === clienteActivo), d.key);
      seleccionarCliente(clienteActivo);
    } else {
      toast('Error al resetear');
    }
  } catch(e) {
    toast('Error: ' + e.message);
  }
}

function abrirLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('visible');
}
function cerrarLightbox() {
  document.getElementById('lightbox').classList.remove('visible');
}
</script>
</body>
</html>
