<style>
:root{
  --verde:#3ecf3e; --amarillo:#f5c200; --rojo:#e03030;
  --blanco:#f0f0e8; --fondo:#050805;
  --superficie:rgba(9,14,9,0.82); --borde:rgba(245,194,0,0.22);

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fondo);color:var(--blanco);font-family:'EB Garamond',serif;min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:50;background:rgba(5,8,5,0.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--borde);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.15rem;letter-spacing:2px;text-transform:uppercase;color:var(--amarillo)}
header h1 span{color:var(--verde)}
.contador{font-family:'Oswald',sans-serif;font-size:.85rem;letter-spacing:1px;color:var(--blanco);opacity:.85;margin-left:auto}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:.78rem;cursor:pointer;border:1px solid var(--borde);background:var(--superficie);color:var(--blanco);padding:8px 14px;border-radius:4px;transition:all .2s}
button:hover{border-color:var(--verde);color:var(--verde)}
button:disabled{opacity:.4;cursor:not-allowed}
button.principal{border-color:var(--verde);color:var(--verde)}
button.principal:hover{background:var(--verde);color:#050805}
button.descarga{border-color:var(--amarillo);color:var(--amarillo)}
button.descarga:hover{background:var(--amarillo);color:#050805}
.progreso{width:100%;height:4px;background:rgba(255,255,255,.08);display:none}
.progreso .barra{height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--amarillo));transition:width .3s}
main{max-width:1280px;margin:0 auto;padding:24px 20px}
.acto{margin-bottom:18px;border:1px solid var(--borde);border-radius:8px;background:var(--superficie);overflow:hidden}
.acto-head{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none}
.acto-head:hover{background:rgba(62,207,62,.05)}
.acto-head h2{font-family:'Oswald',sans-serif;font-weight:500;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:var(--verde)}
.acto-head .flecha{margin-left:auto;color:var(--amarillo);transition:transform .25s;font-family:'Oswald',sans-serif}
.acto.abierto .flecha{transform:rotate(90deg)}
.acto-body{display:none;padding:0 18px 18px}
.acto.abierto .acto-body{display:block}
.escena{margin-top:14px}
.escena h3{font-family:'Oswald',sans-serif;font-weight:400;font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--amarillo);border-bottom:1px solid var(--borde);padding-bottom:6px;margin-bottom:12px}
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tarjeta{border:1px solid rgba(255,255,255,.1);border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}
.tarjeta .marco{aspect-ratio:16/9;background:#0a0d0a;display:flex;align-items:center;justify-content:center;position:relative}
.tarjeta .marco img{width:100%;height:100%;object-fit:cover;display:block}
.tarjeta .marco .vacio{font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:2px;color:rgba(240,240,232,.25);text-transform:uppercase}
.tarjeta .marco .girando{width:26px;height:26px;border:3px solid rgba(62,207,62,.2);border-top-color:var(--verde);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.tarjeta .info{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:8px}
.tarjeta .titulo{font-family:'Oswald',sans-serif;font-size:.8rem;letter-spacing:1px;color:var(--blanco)}
.tarjeta .titulo b{color:var(--verde);font-weight:600}
.tarjeta .desc{font-size:.92rem;font-style:italic;opacity:.8;line-height:1.35}
.tarjeta textarea{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:4px;color:var(--blanco);font-family:'EB Garamond',serif;font-size:.85rem;padding:6px 8px;resize:vertical;min-height:54px;display:none}
.tarjeta.editar textarea{display:block}
.tarjeta .botones{display:flex;gap:6px;flex-wrap:wrap}
.tarjeta .botones button{padding:6px 10px;font-size:.7rem}
.tarjeta .estado-err{font-family:'Oswald',sans-serif;font-size:.68rem;letter-spacing:1px;color:var(--rojo)}
.negro .marco{background:#000}
.negro .marco .vacio{color:rgba(240,240,232,.5)}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(5,8,5,.96);border-top:1px solid var(--borde);padding:10px 20px;display:flex;align-items:center;gap:14px;z-index:50}
footer .msg{font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:1px;opacity:.85}
@media(max-width:640px){.grilla{grid-template-columns:1fr}header h1{font-size:.95rem}}
</style>
</head>

// ---------- render ----------
const main = document.getElementById("main");
let totalGenerables = 0;

DATA.forEach((acto, ai)=>{
  const actoNum = ai+1;
  const divA = document.createElement("div");
  divA.className = "acto" + (ai===0 ? " abierto" : "");
  const head = document.createElement("div");
  head.className = "acto-head";
  head.innerHTML = `<h2>${acto.acto}</h2><span class="flecha">▶</span>`;
  head.onclick = ()=> divA.classList.toggle("abierto");
  divA.appendChild(head);
  const body = document.createElement("div");
  body.className = "acto-body";

  acto.escenas.forEach(esc=>{
    const divE = document.createElement("div");
    divE.className = "escena";
    divE.innerHTML = `<h3>Escena ${esc.n} — ${esc.titulo}</h3>`;
    const grilla = document.createElement("div");
    grilla.className = "grilla";

    esc.planos.forEach(pl=>{
      const id = idDe(actoNum, esc.n, pl.n);
      const card = document.createElement("div");
      card.className = "tarjeta" + (pl.p===null ? " negro" : "");
      card.id = "card_" + id;

      if(pl.p === null){
        card.innerHTML = `
          <div class="marco"><span class="vacio">Fundido a negro</span></div>
          <div class="info"><div class="titulo"><b>Plano ${pl.n}</b> · ${pl.t}</div></div>`;
        grilla.appendChild(card);
        return;
      }
      totalGenerables++;

      card.innerHTML = `
        <div class="marco" id="marco_${id}"><span class="vacio">Sin generar</span></div>
        <div class="info">
          <div class="titulo"><b>Plano ${pl.n}</b> · ${pl.t}</div>
          <div class="desc">${pl.d}</div>
          <textarea id="prompt_${id}">${pl.p + ESTILO}</textarea>
          <div class="botones">
            <button onclick="generar('${id}')" id="btn_${id}">Generar</button>
            <button onclick="toggleEditar('${id}')">Prompt</button>
            <button class="descarga" onclick="descargar('${id}')" id="dl_${id}" disabled>↓ ${nombreArchivo(id)}</button>
          </div>
          <div class="estado-err" id="err_${id}"></div>
        </div>`;
      grilla.appendChild(card);
    });

    divE.appendChild(grilla);
    body.appendChild(divE);
  });

  divA.appendChild(body);
  main.appendChild(divA);
});

// restaurar imágenes guardadas
Object.keys(guardado).forEach(id=>{
  if(document.getElementById("marco_"+id)) pintarImagen(id, guardado[id]);
});
actualizarContador();

// ---------- funciones ----------
function pintarImagen(id, url){
  const marco = document.getElementById("marco_"+id);
  marco.innerHTML = `<img src="${url}" alt="${id}">`;
  const dl = document.getElementById("dl_"+id);
  if(dl) dl.disabled = false;
}

function toggleEditar(id){
  document.getElementById("card_"+id).classList.toggle("editar");
}

function actualizarContador(){
  const n = Object.keys(guardado).length;
  document.getElementById("contador").textContent = `${n} / ${totalGenerables}`;
}

function msg(t){ document.getElementById("msg").textContent = t; }

async function generar(id){
  const btn = document.getElementById("btn_"+id);
  const marco = document.getElementById("marco_"+id);
  const err = document.getElementById("err_"+id);
  const prompt = document.getElementById("prompt_"+id).value.trim();
  btn.disabled = true;
  err.textContent = "";
  marco.innerHTML = `<div class="girando"></div>`;
  try{
    const r = await fetch(WORKER, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ prompt })
    });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const url = data.images && data.images[0] && data.images[0].url;
    if(!url) throw new Error("Sin imagen en la respuesta");
    guardado[id] = url;
    localStorage.setItem(KEY, JSON.stringify(guardado));
    pintarImagen(id, url);
    actualizarContador();
  }catch(e){
    marco.innerHTML = `<span class="vacio">Error</span>`;
    err.textContent = e.message;
  }
  btn.disabled = false;
}

const pausa = ms => new Promise(r=>setTimeout(r,ms));

async function generarTodo(){
  detener = false;
  const ids = [];
  document.querySelectorAll("[id^='btn_']").forEach(b=>{
    const id = b.id.slice(4);
    if(!guardado[id]) ids.push(id);
  });
  if(!ids.length){ msg("No hay pendientes — todo generado."); return; }

  const prog = document.getElementById("progreso");
  const barra = document.getElementById("barra");
  const btnT = document.getElementById("btnTodo");
  const btnD = document.getElementById("btnDetener");
  prog.style.display = "block"; btnT.disabled = true; btnD.style.display = "inline-block";

  for(let i=0;i<ids.length;i++){
    if(detener){ msg("Detenido. Podés retomar cuando quieras."); break; }
    const id = ids[i];
    msg(`Generando ${i+1} de ${ids.length} — ${id}`);
    document.getElementById("card_"+id).scrollIntoView({behavior:"smooth", block:"center"});
    await generar(id);
    barra.style.width = Math.round(((i+1)/ids.length)*100) + "%";
    await pausa(PAUSA);
  }
  if(!detener) msg("Lote terminado ✔ Ahora podés descargar todas.");
  btnT.disabled = false; btnD.style.display = "none";
  setTimeout(()=>{ prog.style.display="none"; barra.style.width="0"; }, 1500);
}

async function descargar(id){
  const url = guardado[id];
  if(!url) return;
  try{
    const r = await fetch(url);
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo(id);
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  }catch(e){
    window.open(url, "_blank"); // fallback: guardar manualmente
  }
}

async function descargarTodo(){
  const ids = Object.keys(guardado);
  if(!ids.length){ msg("Todavía no hay imágenes generadas."); return; }
  msg(`Descargando ${ids.length} imágenes...`);
  for(let i=0;i<ids.length;i++){
    await descargar(ids[i]);
    msg(`Descargando ${i+1} de ${ids.length}`);
    await pausa(600);
  }
  msg("Descarga completa ✔ Buscalas en tu carpeta Descargas.");
}

document.getElementById("btnTodo").onclick = generarTodo;
document.getElementById("btnBajarTodo").onclick = descargarTodo;
document.getElementById("btnDetener").onclick = ()=>{ detener = true; };
</script>
</body>
</html>
